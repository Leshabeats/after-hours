name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: after_hours_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: after_hours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U after_hours_test -d after_hours_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://after_hours_test:isolated-test-only@127.0.0.1:5432/after_hours_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Node 22's bundled npm 10 rejects this lockfile; install with npm 11.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Test (memory and ephemeral PostgreSQL contracts/races/rollback)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Node server
        run: npm run build

      - name: Production smoke (isolated PostgreSQL, no external services)
        run: npm run test:production

      - name: Build Vercel deployment
        run: npm run build:vercel
