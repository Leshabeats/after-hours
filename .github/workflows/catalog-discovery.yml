name: Catalog discovery

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      world:
        description: Run both pilot worlds or a single world
        type: choice
        options:
          - pilot
          - games
          - web
        default: pilot

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: catalog-discovery-production
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'Leshabeats/after-hours' && github.ref == 'refs/heads/main'
    environment: catalog-production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.9.0
      - run: npm ci --ignore-scripts
      - name: Collect and publish catalog snapshots
        shell: bash
        run: |
          collect_world() {
            local attempt status
            for attempt in 1 2 3; do
              status=0
              npm run catalog:sync -- --world "$1" --write || status=$?
              if [ "$status" -ne 3 ]; then
                return "$status"
              fi
            done
            return 3
          }
          if [ "$CATALOG_WORLD" = pilot ]; then
            result=0
            collect_world games || result=$?
            collect_world web || result=$?
            exit "$result"
          else
            collect_world "$CATALOG_WORLD"
          fi
        env:
          CATALOG_WORLD: ${{ inputs.world || 'pilot' }}
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
